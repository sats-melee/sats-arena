[package]
name = "sats-arena-local"
description = "Embedded match funding and NWC wallet host for Dolphin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "sats_arena_local"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
fs2 = "0.4"
sats-arena-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rand = "0.9"
tokio = { version = "1", features = ["rt", "time"] }

[dev-dependencies]
async-trait = "0.1"
tempfile = "3"
