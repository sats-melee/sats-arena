[package]
name = "sats-arena-local"
description = "Fake-only embedded funding preview for Dolphin; no listener or real wallet"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "sats_arena_local"
crate-type = ["cdylib", "rlib"]

[dependencies]
sats-arena-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rand = "0.9"
tokio = { version = "1", features = ["rt", "time"] }

[dev-dependencies]
tempfile = "3"
