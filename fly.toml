# Public phone relay: https://melee.landaverde.io
app = "sats-melee-rooms"
primary_region = "iad"
kill_signal = "SIGINT"
kill_timeout = "5s"

[build]
  dockerfile = "Dockerfile"

[deploy]
  strategy = "immediate"

[http_service]
  internal_port = 8080
  force_https = true
  # Room state is in memory; keep the single Machine running.
  auto_stop_machines = "off"
  auto_start_machines = false

  [http_service.concurrency]
    type = "connections"
    soft_limit = 800
    hard_limit = 1000

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
