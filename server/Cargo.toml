[package]
name = "sats-arena-server"
description = "Self-hostable Lightning ledger for Sats Arena"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "sats-arena-server"
path = "src/main.rs"

[dependencies]
sats-arena-protocol = { workspace = true }
sats-arena-core = { workspace = true }
sats-arena-local = { path = "../local" }
sha2 = "0.10"
hex = "0.4"
fs2 = "0.4"
url = "2"
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
futures-util = "0.3"
tokio-tungstenite = "0.28"
rand = "0.9"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "fs"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
