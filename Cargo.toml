[workspace]
resolver = "3"
members = ["protocol", "server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/landaverdend/sats-arena"

[workspace.dependencies]
sats-arena-protocol = { path = "protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
